<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>États des composants</title>
<link rel="stylesheet" href="../dossier.css">
<style>
  body { margin: 0; }
  .barre { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 12px 16px; background: var(--fond); box-shadow: 0 1px 0 var(--trait); }
  .scenes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }
  @media (max-width: 900px) { .scenes { grid-template-columns: 1fr; } }
  .scene h2 { font-size: 14px; margin: 0 0 6px; color: var(--gris); font-weight: 600; }
  iframe { width: 100%; height: 3000px; border: 0; border-radius: 10px; box-shadow: 0 0 0 1px var(--trait); background: #edf2f8; }
  label { font-size: 14px; }
</style>
</head>
<body>
<div class="barre">
  <a href="index.html">← Comparateur</a>
  <b>Chaque composant, dans chacun de ses états</b>
  <label><input type="checkbox" id="sombre"> Après en sombre (option)</label>
</div>
<div class="scenes">
  <div class="scene"><h2>Avant</h2><iframe src="etats-avant.html" title="États avant"></iframe></div>
  <div class="scene"><h2>Après</h2><iframe id="apres" src="etats-apres.html" title="États après"></iframe></div>
</div>
<script>
  document.getElementById('sombre').addEventListener('change', e => { document.getElementById('apres').src = 'etats-apres.html' + (e.target.checked ? '?theme=sombre' : ''); });
</script>
</body>
</html>
